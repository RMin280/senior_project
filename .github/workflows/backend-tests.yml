name: Backend tests

on:
  pull_request:
    paths: ["backend/**", "model/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "model/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            model/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q --cov=app --cov=../model/src --cov-report=term --cov-fail-under=70
